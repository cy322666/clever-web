groups:
  - name: clever-web
    rules:
      - alert: AppUnavailable
        expr: up{job="clever_app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Приложение или метрики недоступны"
          description: "Prometheus не получает метрики приложения более 2 минут."

      - alert: MetricsCollectionError
        expr: clever_metrics_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ошибка сбора метрик приложения"
          description: "Приложение отвечает, но не может собрать внутренние метрики."

      - alert: SchedulerHeartbeatStale
        expr: clever_scheduler_heartbeat_age_seconds > 180 or clever_scheduler_heartbeat_age_seconds < 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Планировщик не работает"
          description: "Heartbeat планировщика не обновлялся более 3 минут."

      - alert: FailedJobsDetected
        expr: clever_queue_failed_jobs_recent_total > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Появились упавшие задачи"
          description: "За последние 10 минут появились новые failed jobs."

      - alert: QueueBacklogHigh
        expr: clever_queue_jobs_total > 200
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Большая очередь задач"
          description: "В очереди больше 200 задач в течение 10 минут."

      - alert: QueueOldestJobTooOld
        expr: clever_queue_oldest_job_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Задача долго стоит в очереди"
          description: "Самая старая задача ожидает больше 15 минут."

      - alert: DbSlowQueriesBurst
        expr: (sum(increase(clever_db_slow_queries_by_context_total[10m])) or increase(clever_db_slow_queries_total[10m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Много медленных запросов к БД"
          description: "За 10 минут обнаружено больше 10 медленных SQL-запросов."
