global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: clever_app
    scheme: https
    metrics_path: /metrics
    params:
      token: ["__METRICS_TOKEN__"]
    static_configs:
      - targets: ["app.clevercrm.pro:443"]
