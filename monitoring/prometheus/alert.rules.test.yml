rule_files:
  - alert.rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="clever_app",instance="app.clevercrm.pro:443"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: AppUnavailable
        exp_alerts: []
      - eval_time: 3m
        alertname: AppUnavailable
        exp_alerts:
          - exp_labels:
              alertname: AppUnavailable
              instance: app.clevercrm.pro:443
              job: clever_app
              severity: critical
            exp_annotations:
              summary: "Приложение или метрики недоступны"
              description: "Prometheus не получает метрики приложения более 2 минут."
