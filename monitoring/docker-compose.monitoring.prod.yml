services:
  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    extra_hosts:
      - "app.clevercrm.pro:host-gateway"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        sed "s|__METRICS_TOKEN__|$${METRICS_TOKEN}|g" /etc/prometheus/prometheus.yml.tmpl
        > /etc/prometheus/prometheus.yml &&
        /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./monitoring/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?TELEGRAM_CHAT_ID is required}
      TELEGRAM_MESSAGE_THREAD_ID: ${TELEGRAM_MESSAGE_THREAD_ID:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    environment:
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        export GF_SECURITY_ADMIN_USER="$${GRAFANA_ADMIN_USER:-admin}" &&
        export GF_SECURITY_ADMIN_PASSWORD="$${GRAFANA_ADMIN_PASSWORD:-$${METRICS_TOKEN}}" &&
        export GF_USERS_ALLOW_SIGN_UP=false &&
        exec /run.sh
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards/clever-web-simple.json:/var/lib/grafana/dashboards/simple/clever-web-simple.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  alertmanager_data:
  grafana_data:
