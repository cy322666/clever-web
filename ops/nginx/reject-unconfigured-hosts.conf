# An unconfigured hostname must never fall through to the application.
# nginx 1.18 requires a certificate even when all HTTP requests are rejected.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    # nginx 1.18 selects allowed TLS versions from this shared listener default.
    # Temporary Beget connectivity workaround (2026-09-13), affecting all HTTPS hosts.
    ssl_protocols TLSv1.2;
    ssl_certificate /etc/letsencrypt/live/app.clevercrm.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.clevercrm.pro/privkey.pem;
    return 444;
}
