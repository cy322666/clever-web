name: Read-only platform incident diagnostics
on:
  push:
    branches: [codex/platform-alert-fixes-20261102]
    paths: [.github/workflows/platform-incident-diagnostics.yml, .github/scripts/platform_incident_read.py]
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment: production
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4
      - name: Capture redacted read-only diagnostics
        id: capture
        shell: bash
        run: |
          set -uo pipefail
          install -d -m 700 "$RUNNER_TEMP/incident-ssh"
          task_key="$RUNNER_TEMP/incident-ssh/key"
          task_hosts="$RUNNER_TEMP/incident-ssh/known_hosts"
          trap 'rm -f "$task_key"' EXIT
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$task_key"
          chmod 600 "$task_key"
          printf '%s ssh-ed25519 %s\n' "$PROD_SSH_HOST" 'AAAAC3NzaC1lZDI1NTE5AAAAIO5QtI8Pa/Gy9QNgGdFg1M9mFDNYNtAXFCS8F+9jl1ax' > "$task_hosts"
          curl --connect-timeout 8 --max-time 15 -sS -o /dev/null -w '%{http_code}' https://app.clevercrm.pro/up > "$RUNNER_TEMP/incident-health.txt" || true
          task_ssh_exit=0
          timeout 90 ssh -i "$task_key" -p "$PROD_SSH_PORT" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=ssh-ed25519 -o UserKnownHostsFile="$task_hosts" "$PROD_SSH_USER@$PROD_SSH_HOST" 'python3 -' < .github/scripts/platform_incident_read.py > "$RUNNER_TEMP/incident-read.json" 2> "$RUNNER_TEMP/incident-ssh-error.txt" || task_ssh_exit=$?
          export task_ssh_exit
          python3 - <<'PYTHON'
          import json, os, pathlib, re
          tmp=pathlib.Path(os.environ['RUNNER_TEMP'])
          lines=['Public health HTTP ' + (tmp/'incident-health.txt').read_text().strip()]
          try:
              lines += json.loads((tmp/'incident-read.json').read_text())
          except (ValueError, OSError):
              lines += ['SSH exit ' + os.environ['task_ssh_exit'] + ': ' + (tmp/'incident-ssh-error.txt').read_text()[:450]]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              for i, line in enumerate(lines[:24],1):
                  out.write(f'detail_{i:02d}=' + re.sub(r'\s+',' ',str(line))[:650] + '\n')
              out.write('ssh_exit=' + os.environ['task_ssh_exit'] + '\n')
          PYTHON
      - name: "D01: ${{ steps.capture.outputs.detail_01 || 'No additional detail' }}"
        run: ':'
      - name: "D02: ${{ steps.capture.outputs.detail_02 || 'No additional detail' }}"
        run: ':'
      - name: "D03: ${{ steps.capture.outputs.detail_03 || 'No additional detail' }}"
        run: ':'
      - name: "D04: ${{ steps.capture.outputs.detail_04 || 'No additional detail' }}"
        run: ':'
      - name: "D05: ${{ steps.capture.outputs.detail_05 || 'No additional detail' }}"
        run: ':'
      - name: "D06: ${{ steps.capture.outputs.detail_06 || 'No additional detail' }}"
        run: ':'
      - name: "D07: ${{ steps.capture.outputs.detail_07 || 'No additional detail' }}"
        run: ':'
      - name: "D08: ${{ steps.capture.outputs.detail_08 || 'No additional detail' }}"
        run: ':'
      - name: "D09: ${{ steps.capture.outputs.detail_09 || 'No additional detail' }}"
        run: ':'
      - name: "D10: ${{ steps.capture.outputs.detail_10 || 'No additional detail' }}"
        run: ':'
      - name: "D11: ${{ steps.capture.outputs.detail_11 || 'No additional detail' }}"
        run: ':'
      - name: "D12: ${{ steps.capture.outputs.detail_12 || 'No additional detail' }}"
        run: ':'
      - name: "D13: ${{ steps.capture.outputs.detail_13 || 'No additional detail' }}"
        run: ':'
      - name: "D14: ${{ steps.capture.outputs.detail_14 || 'No additional detail' }}"
        run: ':'
