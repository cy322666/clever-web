        run: ':'
      - name: "D16: ${{ steps.capture.outputs.detail_16 || 'No additional detail' }}"
        run: ':'
      - name: "D17: ${{ steps.capture.outputs.detail_17 || 'No additional detail' }}"
        run: ':'
      - name: "D18: ${{ steps.capture.outputs.detail_18 || 'No additional detail' }}"
        run: ':'
      - name: "D19: ${{ steps.capture.outputs.detail_19 || 'No additional detail' }}"
        run: ':'
      - name: "D20: ${{ steps.capture.outputs.detail_20 || 'No additional detail' }}"
        run: ':'
      - name: "D21: ${{ steps.capture.outputs.detail_21 || 'No additional detail' }}"
        run: ':'
      - name: "D22: ${{ steps.capture.outputs.detail_22 || 'No additional detail' }}"
        run: ':'
      - name: "D23: ${{ steps.capture.outputs.detail_23 || 'No additional detail' }}"
