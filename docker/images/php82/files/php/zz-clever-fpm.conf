[www]
listen = 9000

; Allow up to 8 concurrent HTTP requests on the shared 4 CPU / 8 GB host.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 10s
pm.max_requests = 500

; Compose environment must remain available to Laravel workers.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
security.limit_extensions = .php

; HTTP only: CLI / Horizon retain the existing php.ini limits.
; Excel header previews currently read the workbook in the HTTP request.
php_value[memory_limit] = 512M
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /proc/self/fd/2
